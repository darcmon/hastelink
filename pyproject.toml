[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hastelink"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",           # Web framework (handles HTTP requests)
    "uvicorn[standard]>=0.27.0",  # ASGI server (runs your FastAPI app)
    "sqlalchemy[asyncio]>=2.0.0", # ORM (talks to database using Python objects)
    "asyncpg>=0.29.0",            # PostgreSQL driver (async version)
    "pydantic-settings>=2.1.0",   # Load settings from .env files
    "boto3>=1.34.0",              # AWS S3 SDK (works with MinIO too)
    "aioboto3>=12.0.0",           # Async version of boto3
    "python-multipart>=0.0.6",    # Handle file uploads
    "bcrypt==4.0.1",              # Password hashing
    "python-jose[cryptography]>=3.3.0",  # JWT tokens
    "passlib>=1.7.4",             # Password hashing helpers
    "alembic>=1.13.0",            # Database schema migrations
    "authlib>=1.3.0",             # OAuth2 client and server
    "itsdangerous>=2.1.0",        # Token generation and verification
    "httpx>=0.27.0",              # Async HTTP client (for making requests to other services)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
